name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu, and then override in a container.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # We'll only use Ubuntu, but in a container.
        build_type: [RelWithDebInfo, Debug]
        ui: [gui, cli]
        scripting: [lua, noscripts]
        exclude:
          - build_type: Debug
            ui: gui
          - build_type: RelWithDebInfo
            ui: cli
          - build_type: RelWithDebInfo
            scripting: noscripts

    container:
      image: ubuntu:22.04  # Use Ubuntu 22.04 in a container.  This should have a newer GLIBC.
      options: --privileged # You might need this for some operations.  Use with caution.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Update and Install Dependencies (in container)
        run: |
          apt-get update -qq
          apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev \
            cmake ninja-build wget unzip

      - name: Install Skia
        if: ${{ matrix.ui == 'gui' }}
        shell: bash
        run: |
          this_dir="${GITHUB_WORKSPACE}" # Use the standard env var inside the container.
          skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
          skia_file=$(basename $skia_url)
          wget -q "$skia_url"  # Use wget, which is more common in Docker images
          unzip "$skia_file" -d skia

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.17
        with:
          key: ${{ matrix.os }}-${{ matrix.ui }}-${{ matrix.scripting }}-${{ matrix.build_type }}

      - uses: aseprite/get-ninja@main

      - name: Generating Makefiles
        shell: bash
        run: |
          export enable_ccache=on # Enable ccache in the container.
          export enable_scripting=${{ matrix.scripting == 'lua' && 'on' || 'off' }}
          export laf_backend=${{ matrix.ui == 'gui' && 'skia' || 'none' }}
          export skia_arch=x64 # Assume x64 for Ubuntu on amd64

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DENABLE_TESTS=ON \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)

      - name: Compiling
        shell: bash
        run: |
          cd build && ninja

      - name: Upload Binaries as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-binaries-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.ui }}-${{ matrix.scripting }}
          path: build/bin

      - name: Running C++ Tests
        shell: bash
        run: |
          export XVFB="xvfb-run --server-args='-screen 0 1024x768x24'" # Correct xvfb usage
          cd build && $XVFB ctest --output-on-failure
          
      - name: Running CLI Tests
        if: ${{ matrix.scripting == 'lua' }}
        shell: bash
        run: |
          export XVFB="xvfb-run --server-args='-screen 0 1024x768x24'"
          export ASEPRITE=$PWD/build/bin/aseprite
          cd tests
          $XVFB bash run-tests.sh
